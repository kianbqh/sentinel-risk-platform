name: platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    env: {SPARK_MASTER: 'local[2]', OMP_NUM_THREADS: '2', OPENBLAS_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: batch/requirements.txt}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: pip install -r batch/requirements.txt
      - run: python -m pytest --capture=sys -q tests
        working-directory: batch
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:text-risk
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r gateway/requirements-dev.txt flask==3.1.3
      - run: python scripts/verify_artifacts.py
      - run: python -m pytest --capture=sys -q gateway/tests text-risk/tests security/tests
  console:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: postgres, PGUSER: postgres}
        ports: ['15440:5432']
        options: --health-cmd=pg_isready --health-interval=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26', cache-dependency-path: console/backend/go.sum}
      - run: go test -race -count=1 ./...
        working-directory: console/backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:15440/postgres?sslmode=disable
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: console/frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: console/frontend
  streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch test
        working-directory: streaming
        env: {JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'}
  graph:
    runs-on: ubuntu-latest
    env: {DEVICE: cpu, OMP_NUM_THREADS: '2', OPENBLAS_NUM_THREADS: '2', MKL_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r research/graph/requirements-lock.txt
      - run: python -m pytest --capture=sys -q tests
        working-directory: research/graph
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.14.0'}
      - run: terraform fmt -check -recursive
        working-directory: deploy/terraform
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: deploy/terraform
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install bandit==1.9.4 semgrep==1.183.0
      - run: python scripts/security_sast.py
      - run: bash scripts/trivy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: production-security, path: results/security}
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: sentinel-ci
      PYTHONPATH: .:text-risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r gateway/requirements-dev.txt
      - run: bash scripts/up.sh && bash scripts/demo.sh
      - run: docker compose -f compose.yml exec -T console nginx -T > results/nginx-config.txt 2>&1
      - run: python scripts/load_console.py
      - run: python scripts/scan_console.py
      - run: docker compose -f compose.yml logs --no-color > results/compose.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: compose-integration, path: results}
      - run: docker compose -f compose.yml down -v
        if: always()
  ops-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest==9.2.0
      - name: Install isolated validation tools
        run: python ops/scripts/install_tools.py --directory "$GITHUB_WORKSPACE/.runtime/ops/tools" --tools helm kubeconform promtool shellcheck bats
      - name: Rules, shell, evidence gates and rendered manifests
        run: |
          export PATH="$GITHUB_WORKSPACE/.runtime/ops/tools:$PATH"
          mkdir -p .runtime/ops
          python -c 'import json;from pathlib import Path;p=Path("ops/config.json");c=json.loads(p.read_text());c["environment"]="GitHub-hosted Linux runner, CPU validation";Path(".runtime/ops/ci-config.json").write_text(json.dumps(c,indent=2)+"\n")'
          python ops/static_check.py --config .runtime/ops/ci-config.json --output "results/ops/ci-$GITHUB_SHA/static.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ops-static, path: 'results/ops/ci-*'}
  ops-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: sentinel-m1b-ci
      OPS_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build and start opt-in ops project
        run: bash ops/scripts/up.sh
      - name: Real scrapes, Spark listener and parented trace
        run: |
          python -c 'import json;from pathlib import Path;c=json.loads(Path("ops/config.json").read_text());c["environment"]="GitHub-hosted Linux runner with Docker containers";Path(".runtime/ops/ci-config.json").write_text(json.dumps(c,indent=2)+"\n")'
          python ops/verify.py smoke --config .runtime/ops/ci-config.json --output "results/ops/ci-$GITHUB_SHA/smoke.json"
          python ops/verify.py spark --config .runtime/ops/ci-config.json --output "results/ops/ci-$GITHUB_SHA/spark.json"
          python ops/verify.py trace --config .runtime/ops/ci-config.json --output "results/ops/ci-$GITHUB_SHA/trace.json"
      - name: Real database outage and offset recovery drill
        run: python ops/verify.py drill --config .runtime/ops/ci-config.json --output "results/ops/ci-$GITHUB_SHA/drill-db-outage.json"
      - name: Preserve own service logs
        if: always()
        run: |
          mkdir -p "results/ops/ci-$GITHUB_SHA"
          docker compose --env-file .runtime/ops/.env --project-name sentinel-m1b-ci -f compose.yml -f ops/compose.ops.yml --profile ops logs --no-color > "results/ops/ci-$GITHUB_SHA/compose.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ops-integration, path: 'results/ops/ci-*'}
      - name: Stop only this job's project
        if: always()
        run: docker compose --env-file .runtime/ops/.env --project-name sentinel-m1b-ci -f compose.yml -f ops/compose.ops.yml --profile ops down -v
  kind-helm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated Kubernetes tools
        run: python ops/scripts/install_tools.py --directory "$GITHUB_WORKSPACE/.runtime/ops/tools" --tools helm kind kubectl
      - name: Install, rolling upgrade under load, rollback and pod recovery
        env:
          SENTINEL_CONFIG: .runtime/ops/ci-config.json
          SENTINEL_OUTPUT_DIR: 'results/ops/ci-${{ github.sha }}'
        run: |
          export PATH="$GITHUB_WORKSPACE/.runtime/ops/tools:$PATH"
          python -c 'import json;from pathlib import Path;c=json.loads(Path("ops/config.json").read_text());c["environment"]="GitHub-hosted Linux runner, single-node kind with Docker containers";Path(".runtime/ops/ci-config.json").write_text(json.dumps(c,indent=2)+"\n")'
          bash ops/scripts/kind.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: kind-helm, path: 'results/ops/ci-*'}
