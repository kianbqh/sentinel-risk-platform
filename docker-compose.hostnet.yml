# Override for hosts where Docker runs without iptables (no bridge DNS/NAT), e.g. some CI sandboxes:
#   docker compose -f docker-compose.yml -f docker-compose.hostnet.yml up -d
services:
  db:
    network_mode: host
    ports: !reset []
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs -p ${POSTGRES_PORT:-5432}"]
  backend:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: "postgres://postgres:postgres@localhost:${POSTGRES_PORT:-5432}/jobs?sslmode=disable"
      PORT: "${API_PORT:-8080}"
  frontend:
    network_mode: host
    ports: !reset []
    environment:
      LISTEN_PORT: "${UI_PORT:-3000}"
      BACKEND_URL: "http://localhost:${API_PORT:-8080}"
