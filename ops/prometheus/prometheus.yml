global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [gateway:18040]
  - job_name: console-backend
    static_configs:
      - targets: [backend:18041]
  - job_name: spark-scorer
    static_configs:
      - targets: [streaming:9108]
