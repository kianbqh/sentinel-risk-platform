{{- $root := . -}}
{{- $name := include "sentinel.fullname" . -}}
{{- if lt (int .Values.termination.preStopSeconds) 0 -}}
{{- fail "termination.preStopSeconds must be nonnegative" -}}
{{- end -}}
{{- if lt (int .Values.termination.graceSeconds) (add (int .Values.termination.preStopSeconds) 10) -}}
{{- fail "termination.graceSeconds must allow preStopSeconds plus at least 10 seconds for application shutdown" -}}
{{- end -}}
{{- range $component := list "gateway" "backend" "frontend" }}
{{- $port := index $root.Values.service (printf "%sPort" $component) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "sentinel.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $root.Values.replicas }}
  revisionHistoryLimit: 3
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.termination.graceSeconds }}
      securityContext: {runAsNonRoot: true}
      {{- if and $root.Values.kafka.enabled (ne $component "frontend") }}
      initContainers:
        - name: wait-kafka
          image: {{ $root.Values.kafka.image | quote }}
          securityContext: {runAsUser: 101, runAsNonRoot: true}
          command: [/bin/sh, -ec]
          args:
            - |
              until rpk cluster info -X brokers="$BROKERS" >/dev/null 2>&1; do sleep 2; done
              rpk topic create "$TOPIC" --partitions 1 --replicas 1 -X brokers="$BROKERS" || rpk topic describe "$TOPIC" -X brokers="$BROKERS"
          env:
            - {name: BROKERS, value: {{ include "sentinel.kafka" $root | quote }}}
            - {name: TOPIC, value: {{ $root.Values.kafka.topic | quote }}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" (index $root.Values.images $component).repository ((index $root.Values.images $component).tag | toString) | quote }}
          imagePullPolicy: {{ (index $root.Values.images $component).pullPolicy }}
          {{- if gt (int $root.Values.termination.preStopSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $root.Values.termination.preStopSeconds }}
          {{- end }}
          securityContext:
            runAsUser: {{ if eq $component "gateway" }}10001{{ else if eq $component "backend" }}65532{{ else }}101{{ end }}
            runAsNonRoot: true
          ports: [{name: http, containerPort: {{ $port }}}]
          env:
            - {name: PORT, value: {{ $port | quote }}}
            {{- if eq $component "frontend" }}
            - {name: LISTEN_PORT, value: {{ $port | quote }}}
            - {name: BACKEND_URL, value: {{ printf "http://%s-backend:%v" $name $root.Values.service.backendPort | quote }}}
            {{- else }}
            - {name: OTEL_SERVICE_NAME, value: {{ ternary "sentinel-gateway" "sentinel-console" (eq $component "gateway") }}}
          envFrom:
            - configMapRef: {name: {{ $name }}}
            - secretRef: {name: {{ $name }}}
            {{- end }}
          startupProbe:
            httpGet: {path: {{ ternary "/" "/healthz" (eq $component "frontend") }}, port: http}
            periodSeconds: 3
            failureThreshold: 80
          livenessProbe:
            httpGet: {path: {{ ternary "/" "/healthz" (eq $component "frontend") }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: {{ ternary "/" "/readyz" (eq $component "frontend") }}, port: http}
            periodSeconds: 2
            timeoutSeconds: 4
            failureThreshold: 2
          resources:
            {{- index $root.Values.resources $component | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "sentinel.labels" $root | nindent 4 }}
spec:
  type: {{ $root.Values.service.type }}
  selector: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
  ports: [{name: http, port: {{ $port }}, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-{{ $component }}
spec:
  minAvailable: {{ $root.Values.pdb.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
{{- end }}
