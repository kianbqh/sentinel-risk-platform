apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ include "sentinel.kafka" . | quote }}
  ALERTS_TOPIC: {{ .Values.kafka.topic | quote }}
  ALERTS_GROUP: {{ .Values.kafka.group | quote }}
  CLASSIFIER_MODE: tfidf
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  BCRYPT_COST: "10"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.tracing.endpoint | quote }}
  CORS_ORIGIN: "http://localhost:13040"
