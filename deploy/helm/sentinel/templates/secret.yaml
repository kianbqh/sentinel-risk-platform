{{- $password := required "auth.postgresPassword is required" .Values.auth.postgresPassword -}}
{{- $jwt := required "auth.jwtSecret is required" .Values.auth.jwtSecret -}}
{{- if lt (len $jwt) 32 }}{{ fail "auth.jwtSecret must contain at least 32 bytes" }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  JWT_SECRET: {{ $jwt | b64enc | quote }}
  DATABASE_URL: {{ printf "postgres://sentinel:%s@%s-postgres:5432/sentinel?sslmode=disable" ($password | urlquery) (include "sentinel.fullname" .) | b64enc | quote }}
