services:
  fraud-api:
    build: .
    image: fraud-scoring:1.0.0
    ports: ["8000:8000"]
    environment:
      WORKERS: "1"
      LOG_LEVEL: INFO
      MAX_BATCH: "512"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.getenv('PORT','8000')+'/health/ready',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    restart: unless-stopped
