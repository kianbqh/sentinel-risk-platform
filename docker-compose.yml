services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: jobs}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"]
      interval: 2s
      retries: 20
  backend:
    image: ${COMPOSE_PROJECT_NAME:-fullstack-go-graphql}-backend:local
    build: {context: ./backend, network: host}
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/jobs?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      CORS_ORIGIN: http://localhost:${UI_PORT:-3000}
    ports: ["${API_PORT:-8080}:8080"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    image: ${COMPOSE_PROJECT_NAME:-fullstack-go-graphql}-frontend:local
    build: {context: ./frontend, network: host}
    ports: ["${UI_PORT:-3000}:80"]
    depends_on: [backend]
volumes:
  db_data:
